<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="game-title">Jogo - Visual Studio and Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="bg-black text-white flex flex-col h-screen justify-between p-2 md:p-3 font-sans overflow-hidden">

    <!-- Cabeçalho compacto -->
    <header class="w-full max-w-7xl mx-auto flex justify-between items-center py-1 border-b border-white/10 shrink-0">
        <a href="index.html" class="text-xs uppercase tracking-wider text-gray-400 hover:text-[#ff4655] transition-colors font-mono">
            ← Voltar ao Catálogo
        </a>
        <h1 id="title-display" class="text-xs md:text-sm font-bold font-orbitron uppercase tracking-wide text-white truncate max-w-[50%] text-center">
            A carregar...
        </h1>
        <button onclick="openFullscreen()" class="px-2.5 py-1 bg-[#ff4655] hover:bg-[#e03e4d] text-white font-bold rounded text-xs transition-colors cursor-pointer font-mono">
            ⛶ Tela Cheia
        </button>
    </header>

    <!-- Conteúdo Principal Otimizado para Ocupar a Altura Máxima -->
    <main class="w-full flex-grow flex items-center justify-center py-1 overflow-hidden">
        <!-- Container com altura máxima de 88vh e largura automática adaptável -->
        <div class="h-full max-h-[88vh] aspect-[9/16] md:aspect-[4/3] w-auto max-w-full bg-gray-900 rounded-lg overflow-hidden border border-white/10 shadow-2xl relative flex items-center justify-center">
            <iframe id="game-iframe" src="" class="w-full h-full border-0" allowfullscreen></iframe>
        </div>
    </main>

    <!-- Rodapé compacto -->
    <footer class="w-full max-w-7xl mx-auto text-center py-1 text-[10px] text-gray-600 border-t border-white/10 font-mono shrink-0">
        &copy; 2026 VISUAL STUDIO AND SECURITY // BR
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gameUrl = params.get('url');
        const gameTitle = params.get('title');

        if (gameUrl) {
            document.getElementById('game-iframe').src = decodeURIComponent(gameUrl);
            const decodedTitle = decodeURIComponent(gameTitle || "Jogo Web");
            document.getElementById('title-display').innerText = decodedTitle;
            document.getElementById('game-title').innerText = `${decodedTitle} - Visual Studio and Security`;
        } else {
            document.getElementById('title-display').innerText = "Jogo não encontrado";
        }

        function openFullscreen() {
            const iframe = document.getElementById('game-iframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
