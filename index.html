<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="game-title">Jogo - Visual Studio and Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="bg-black text-white flex flex-col min-h-screen justify-between p-4 font-sans">

    <!-- Cabeçalho -->
    <header class="w-full max-w-6xl mx-auto flex justify-between items-center py-4 border-b border-white/10">
        <a href="index.html" class="text-xs uppercase tracking-wider text-gray-400 hover:text-[#ff4655] transition-colors font-mono">
            ← Voltar ao Catálogo
        </a>
        <span class="text-xs text-gray-500 font-mono hidden sm:inline">VISUAL STUDIO AND SECURITY</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="w-full max-w-6xl mx-auto flex flex-col items-center my-auto py-4">
        
        <!-- Barra Superior do Jogo (Título + Botões de Redimensionamento e Fullscreen) -->
        <div class="w-full flex flex-col sm:flex-row justify-between items-center gap-3 mb-4 bg-gray-900/60 p-3 rounded-lg border border-white/10">
            <h1 id="title-display" class="text-lg font-bold font-orbitron uppercase tracking-wide text-white">
                A carregar jogo...
            </h1>

            <div class="flex items-center gap-2 font-mono text-xs">
                <!-- Botão Alternar Tamanho (Cinema / Padrão) -->
                <button id="btn-resize" onclick="toggleSize()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 border border-white/10 rounded text-gray-300 transition-colors">
                    ↔ Expansão Cinema
                </button>

                <!-- Botão Tela Cheia -->
                <button onclick="openFullscreen()" class="px-3 py-1.5 bg-[#ff4655] hover:bg-[#e03e4d] text-white font-bold rounded transition-colors flex items-center gap-1">
                    ⛶ Tela Cheia
                </button>
            </div>
        </div>

        <!-- Container do Jogo -->
        <div id="game-wrapper" class="w-full h-[600px] bg-gray-900 rounded-lg overflow-hidden border border-white/10 shadow-2xl relative transition-all duration-300">
            <iframe id="game-iframe" src="" class="w-full h-full border-0 absolute inset-0" allowfullscreen></iframe>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="w-full max-w-6xl mx-auto text-center py-4 text-xs text-gray-600 border-t border-white/10 font-mono">
        &copy; 2026 VISUAL STUDIO AND SECURITY // BR
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gameUrl = params.get('url');
        const gameTitle = params.get('title');

        if (gameUrl) {
            document.getElementById('game-iframe').src = decodeURIComponent(gameUrl);
            const decodedTitle = decodeURIComponent(gameTitle || "Jogo Web");
            document.getElementById('title-display').innerText = decodedTitle;
            document.getElementById('game-title').innerText = `${decodedTitle} - Visual Studio and Security`;
        } else {
            document.getElementById('title-display').innerText = "Jogo não encontrado ou URL inválida.";
        }

        // Função para ativar Tela Cheia no Iframe
        function openFullscreen() {
            const iframe = document.getElementById('game-iframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) { /* Safari */
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) { /* IE11 */
                iframe.msRequestFullscreen();
            }
        }

        // Função para alternar a altura do container (Expansão / Padrão)
        let isExpanded = false;
        function toggleSize() {
            const wrapper = document.getElementById('game-wrapper');
            const btn = document.getElementById('btn-resize');

            if (!isExpanded) {
                wrapper.classList.remove('h-[600px]');
                wrapper.classList.add('h-[800px]');
                btn.innerText = "↘ Tamanho Padrão";
                isExpanded = true;
            } else {
                wrapper.classList.remove('h-[800px]');
                wrapper.classList.add('h-[600px]');
                btn.innerText = "↔ Expansão Cinema";
                isExpanded = false;
            }
        }
    </script>
</body>
</html>
