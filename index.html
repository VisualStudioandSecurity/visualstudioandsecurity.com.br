<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Studio and Security // Jogos & Artigos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Orbitron e Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .card-game-hover:hover .game-thumb-img {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gray-100 font-inter text-gray-900 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-white border-b border-gray-200 py-4 px-6 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-orbitron font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-gray-900 to-[#ff4655]">
                VISUAL STUDIO AND SECURITY
            </h1>
            <nav class="flex items-center gap-6 text-xs font-mono font-bold text-gray-600">
                <a href="privacidade.html" class="hover:text-[#ff4655] transition-colors">PRIVACIDADE</a>
                <a href="sobre.html" class="hover:text-[#ff4655] transition-colors">SOBRE</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Barra de Pesquisa e Filtros -->
        <div class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
            <input type="text" id="search-input" placeholder="Pesquisar jogos por nome..." class="w-full md:w-96 px-4 py-2 border border-gray-200 rounded-lg text-xs font-mono focus:outline-none focus:border-[#ff4655]">
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 text-xs font-mono font-bold">
                <button onclick="filtrarCategoria('all')" class="px-3 py-1.5 bg-gray-900 text-white rounded-lg hover:bg-[#ff4655] transition-colors">Todos</button>
                <button onclick="filtrarCategoria('action')" class="px-3 py-1.5 bg-gray-100 text-gray-700 border border-gray-200 rounded-lg hover:border-[#ff4655] transition-colors">Ação</button>
                <button onclick="filtrarCategoria('racing')" class="px-3 py-1.5 bg-gray-100 text-gray-700 border border-gray-200 rounded-lg hover:border-[#ff4655] transition-colors">Corrida</button>
            </div>
        </div>

        <!-- Secção em Destaque -->
        <div id="seccao-destaques" class="mb-10">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-[#ff4655] text-lg">🔥</span>
                <h2 class="text-lg font-orbitron font-bold text-gray-900 uppercase tracking-wide">JOGOS EM DESTAQUE</h2>
            </div>
            <div id="grid-destaques" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Inserido dinamicamente via script -->
            </div>
        </div>

        <!-- Catálogo Completo -->
        <div class="mb-6 border-b border-gray-200 pb-4 flex justify-between items-end">
            <div>
                <h2 class="text-xl font-orbitron font-bold text-gray-900 tracking-wide">CATÁLOGO COMPLETO</h2>
                <p class="text-xs text-gray-500 font-mono mt-1">// JOGOS EM HTML5 AUTOMATICAMENTE ATUALIZADOS</p>
            </div>
            <span id="game-count" class="text-xs font-mono text-gray-600 bg-gray-100 px-3 py-1 rounded border border-gray-200">A carregar...</span>
        </div>

        <!-- Grelha de Jogos do Catálogo -->
        <div id="lista-de-jogos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Os jogos serão carregados aqui -->
            <p class="col-span-full text-center font-mono text-gray-500 text-xs py-10">A carregar os jogos do servidor...</p>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500 font-mono">
        &copy; 2026 Visual Studio and Security. Todos os direitos reservados.
    </footer>

    <!-- Script Completo de Gestão e Destaques -->
    <script>
        let todosOsJogos = [];
        const searchInput = document.getElementById("search-input");

        const jogoFixoHazmob = {
            title: "Hazmob FPS: Online Shooter",
            url: "https://playgama.com/export/game/hazmob-fps-online-shooter",
            thumb: "https://images.crazygames.com/hazmob-fps-online-shooter/20240319114702/hazmob-fps-online-shooter-cover?auto=format,compress&q=75&w=1200",
            isFixed: true
        };

        function criarCardJogo(jogo, ehDestaque = false) {
            const card = document.createElement("a");
            card.href = `jogo.html?title=${encodeURIComponent(jogo.title || "Jogo")}&url=${encodeURIComponent(jogo.url || "")}`;
            
            if (ehDestaque) {
                card.className = "card-game-hover group relative bg-gray-900 rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 h-48 flex flex-col justify-end p-4 border border-gray-800 hover:border-[#ff4655]";
            } else {
                card.className = "card-game-hover group bg-gray-50 border border-gray-200 rounded-lg overflow-hidden hover:border-[#ff4655] transition-all duration-300 flex flex-col justify-between hover:scale-[1.02] shadow-sm";
            }

            const thumb = document.createElement("div");
            thumb.className = ehDestaque ? "absolute inset-0 w-full h-full bg-gray-900" : "w-full h-36 overflow-hidden relative bg-gray-200";

            if (jogo.thumb) {
                const img = document.createElement("img");
                img.src = jogo.thumb;
                img.alt = jogo.title || "Game";
                img.className = `game-thumb-img w-full h-full object-cover transition-all duration-500 ${ehDestaque ? 'opacity-70 group-hover:opacity-90' : ''}`;
                img.loading = "lazy";
                thumb.appendChild(img);
            }

            if (ehDestaque) {
                const overlay = document.createElement("div");
                overlay.className = "relative z-10 flex flex-col justify-end h-full";
                overlay.innerHTML = `
                    <span class="bg-[#ff4655] text-white text-[9px] font-mono font-bold px-2 py-0.5 rounded w-max mb-1 uppercase">DESTAQUE FIXO</span>
                    <h3 class="text-sm font-bold text-white group-hover:text-[#ff4655] transition-colors uppercase font-orbitron line-clamp-1">${jogo.title || "Jogo"}</h3>
                    <div class="mt-1 flex items-center justify-between text-[10px] text-gray-300 font-mono">
                        <span>JOGAR AGORA</span>
                        <span class="text-[#ff4655]">▶</span>
                    </div>
                `;
                card.appendChild(thumb);
                card.appendChild(overlay);
            } else {
                const body = document.createElement("div");
                body.className = "p-3 flex flex-col justify-between flex-grow bg-white";

                const title = document.createElement("h3");
                title.className = "text-xs font-bold text-gray-800 group-hover:text-[#ff4655] transition-colors line-clamp-2 uppercase tracking-wide font-orbitron";
                title.textContent = jogo.title || "Jogo";

                const footer = document.createElement("div");
                footer.className = "mt-3 flex items-center justify-between text-[10px] text-gray-500 font-mono";
                footer.innerHTML = `<span>PLAY</span><span class="text-[#ff4655]">▶</span>`;

                body.appendChild(title);
                body.appendChild(footer);
                card.appendChild(thumb);
                card.appendChild(body);
            }

            return card;
        }

        function renderizarJogos(lista) {
            const container = document.getElementById("lista-de-jogos");
            const gridDestaques = document.getElementById("grid-destaques");
            const seccaoDestaques = document.getElementById("seccao-destaques");
            
            if (!container) return;
            container.innerHTML = "";
            if (gridDestaques) gridDestaques.innerHTML = "";

            const estaFiltrando = searchInput && searchInput.value.trim() !== "";

            if (!estaFiltrando && seccaoDestaques && gridDestaques) {
                seccaoDestaques.style.display = "block";
                gridDestaques.appendChild(criarCardJogo(jogoFixoHazmob, true));

                const outrosDestaques = lista.slice(0, 2);
                outrosDestaques.forEach(jogo => gridDestaques.appendChild(criarCardJogo(jogo, true)));
            } else if (seccaoDestaques) {
                seccaoDestaques.style.display = "none";
            }

            const jogosParaGrid = (!estaFiltrando) ? lista.slice(2) : lista;
            jogosParaGrid.forEach(jogo => container.appendChild(criarCardJogo(jogo, false)));
        }

        searchInput?.addEventListener("input", (e) => {
            const termo = (e.target.value || "").toLowerCase().trim();
            const jogosFiltrados = todosOsJogos.filter((jogo) =>
                (jogo.title || "").toLowerCase().includes(termo)
            );
            renderizarJogos(jogosFiltrados);
        });

        function filtrarCategoria(cat) {
            if (cat === 'all') {
                renderizarJogos(todosOsJogos);
            } else {
                const filtrados = todosOsJogos.filter(jogo => 
                    (jogo.category || "").toLowerCase().includes(cat) || 
                    (jogo.title || "").toLowerCase().includes(cat)
                );
                renderizarJogos(filtrados);
            }
        }

        const RAW_FEED = "https://gamemonetize.com/feed.php?format=0&category=12&page=1";
        const FEED_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(RAW_FEED);

        async function carregarJogosDoFeed() {
            const container = document.getElementById("lista-de-jogos");
            const countDisplay = document.getElementById("game-count");

            try {
                const response = await fetch(FEED_URL);
                if (!response.ok) throw new Error("Erro na rede");
                const jogos = await response.json();

                todosOsJogos = Array.isArray(jogos) ? jogos : [];
                renderizarJogos(todosOsJogos);

                if (countDisplay) {
                    countDisplay.textContent = `${todosOsJogos.length + 1} JOGOS DISPONÍVEIS`;
                }
            } catch (error) {
                console.error("Erro ao carregar o feed:", error);
                if (container) {
                    container.innerHTML = `<p class="col-span-full text-center font-mono text-red-500 text-xs py-10">Erro ao carregar os jogos do servidor. Atualize a página.</p>`;
                }
            }
        }

        carregarJogosDoFeed();
    </script>
</body>
</html>
